version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: agri_database
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: agriguard
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/seed_data.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agriguard_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/agriguard
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      AI_SERVICE_URL: http://ai:5000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: agriguard_ai
    environment:
      FLASK_ENV: production
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: agriguard_frontend
    ports:
      - "80:80"
    volumes:
      - ./backend/src/main/resources/static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
